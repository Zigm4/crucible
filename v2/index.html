<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crucible v2 (preview) - blends, drops, packs and upgrades on WAX</title>
    <meta name="description" content="A preview of the next Crucible: every NeftyBlocks, WaxDAO and Blenderizer recipe still running on WAX, asked one question at a time. Your wallet signs; the page only builds the transaction." />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="/src/ui/style.css" />
    <link rel="stylesheet" href="/src/v2/v2.css" />
    <!--
      Theme bootstrap, before first paint. v2 has two skins, both from the
      classic stylesheets: data-theme="modern" (dark, the default) and
      data-theme="neutral" (light). The choice has its own key, so trying
      v2 never changes how the classic page looks.
    -->
    <script>
      (function () {
        var theme = 'modern';
        try {
          var saved = localStorage.getItem('crucible-v2-theme');
          if (saved === 'neutral' || saved === 'modern') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="v2">
    <main id="app">
      <div class="v2-header" role="banner">
        <a class="v2-brand" href="#/" aria-label="Crucible v2, home">
          <svg class="v2-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="currentColor">
              <path d="M9 2 L11 6 L7 6 Z" opacity="0.85"/>
              <path d="M16 1 L18.5 5.5 L13.5 5.5 Z"/>
              <path d="M23 2 L25 6 L21 6 Z" opacity="0.85"/>
              <path d="M9 7 L13 11 M16 6 L16 11 M23 7 L19 11" stroke-width="0.9" fill="none" opacity="0.55"/>
              <path d="M16 11 L24.5 16 L24.5 25 L16 30 L7.5 25 L7.5 16 Z" stroke-width="1.8" fill="none"/>
            </g>
            <circle cx="16" cy="21" r="3" fill="currentColor" opacity="0.6"/>
          </svg>
          <span class="v2-name">Crucible</span>
          <span class="v2-badge">v2 preview</span>
        </a>
        <nav class="v2-nav" id="v2-nav" aria-label="Main"></nav>
        <div class="v2-header-end">
          <a class="v2-classic" id="v2-classic" href="../">Classic version</a>
          <div class="v2-theme" role="group" aria-label="Theme">
            <button type="button" data-set-theme="neutral">Light</button>
            <button type="button" data-set-theme="modern">Dark</button>
          </div>
        </div>
      </div>
      <section id="root"></section>
      <footer>
        <p>zero backend · audit the source before signing ·
          <a href="../guide.html">user guide</a> ·
          <a href="../#/catalog">collection catalogue</a> ·
          <a href="../#/status">contract status</a></p>
        <p class="attribution">
          Powered by <a href="https://github.com/Zigm4/crucible" target="_blank">Crucible</a> &middot;
          MIT licensed &middot; forks welcome (please keep this credit)
        </p>
      </footer>
    </main>
    <!-- Theme switch wiring: flips data-theme on <html> and remembers it. -->
    <script>
      (function () {
        function paint() {
          var c = document.documentElement.getAttribute('data-theme');
          var opts = document.querySelectorAll('[data-set-theme]');
          for (var i = 0; i < opts.length; i++) {
            var on = opts[i].getAttribute('data-set-theme') === c;
            opts[i].classList.toggle('on', on);
            opts[i].setAttribute('aria-pressed', on ? 'true' : 'false');
          }
        }
        document.addEventListener('click', function (e) {
          var btn = e.target && e.target.closest && e.target.closest('[data-set-theme]');
          if (!btn) return;
          var theme = btn.getAttribute('data-set-theme');
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('crucible-v2-theme', theme); } catch (e2) {}
          paint();
        });
        paint();
      })();
    </script>
    <script type="module" src="/src/v2/main.ts"></script>
  </body>
</html>
