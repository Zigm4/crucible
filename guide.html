<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crucible · User Guide</title>
    <meta name="description" content="The Crucible user guide moved into Crucible v2." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- The guide is a page of the main site now (src/v2/guide.ts). This address stays so
         that every link to it keeps working, its old #anchors included: each
         lands on the section that took over that subject. -->
    <script>
      (function () {
        var moved = {
          start: 'start', blend: 'blends', claim: 'drops', unpack: 'packs', upgrade: 'upgrades',
          waxdao: 'blends', blenderizer: 'blends', artwork: 'trouble', catalogue: 'explore',
          authors: 'create', links: 'links', safety: 'privacy'
        };
        var section = moved[location.hash.replace('#', '')] || '';
        location.replace('./#/guide' + (section ? '/' + section : ''));
      })();
    </script>
    <style>
      body { font-family: system-ui, sans-serif; background: #15171c; color: #d6d9e0; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      a { color: #a99cf5; }
    </style>
  </head>
  <body>
    <p>The user guide moved. <a href="./#/guide">Open it</a>.</p>
  </body>
</html>
